# Defaults are the prod profile at the core tier (design 07 §3).
# For a laptop, add: -f values-local.yaml

# tier: core | plus
#   core  — the engine: what is needed to run governed agents.
#   plus  — adds Argo Workflows, Phoenix, OpenFGA, eval runner images.
# Only `core` is implemented; `plus` is rejected at render rather than silently
# ignored, because a values file that appears to take effect and does not is
# worse than one that errors.
tier: core

# profile: prod | local
#   prod  — replicas, anti-affinity, PDBs.
#   local — single replica everything, local-path storage; the honest mode.
profile: prod

operator:
  image:
    repository: ghcr.io/quinyte/assayd-operator
    # Pinned, never floating: a rollout that cannot be reproduced is not a
    # rollout.
    tag: "0.1.0"
    # A digest WINS over the tag when set, and the release workflow sets it to
    # the digest it published and cosign-signed. A tag can be repointed at other
    # content after signing; a digest names the content itself, which is the
    # same rule assayd's admission applies to agent images (ADR-0019).
    #
    # Verify what you are about to run:
    #   cosign verify ghcr.io/quinyte/assayd-operator@<digest> \
    #     --certificate-identity-regexp '^https://github.com/Quinyte/assayd/' \
    #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
    digest: ""
    pullPolicy: IfNotPresent
  # Two at the prod profile: the operator is leader-elected, so a standby takes
  # over on node failure rather than waiting for a reschedule. The local profile
  # forces this to 1 regardless.
  replicas: 2

  # Leader election is on by default. The chart grants the leases permission it
  # needs; without that grant controller-runtime retries a forbidden lease
  # forever while the pod reports Ready and reconciles nothing.
  leaderElection: true

  # How long a cached answer to "is the EvalSuite CRD installed?" may persist
  # before the next reconcile re-checks it. This bounds the cache, not the agent.
  evalSuiteCheckInterval: 30s

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  # Bound to :8443 with authn/authz filters in a later change; until then the
  # metrics listener is off rather than unauthenticated on all interfaces.
  metrics:
    enabled: false
    port: 8443

  # Disruption budget, prod profile only. maxUnavailable rather than
  # minAvailable: with N replicas a minAvailable of N permits no eviction at
  # all, so `kubectl drain` hangs and routine node maintenance becomes an
  # incident.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  nodeSelector: {}
  tolerations: []
  # Left empty on purpose: the template renders a soft anti-affinity by default
  # so both replicas do not land on one node. Setting this replaces it, which is
  # the right escape hatch for a cluster with its own topology rules.
  affinity: {}

# The namespace the operator runs in. CRs may live anywhere. Agent WORKLOADS
# and revision material do not live where the Agent does: the operator creates
# one `assayd-run-<agent-namespace>` per namespace that holds an Agent (design
# 02 A42), and keeps its binding records here.
namespace: assayd-system

# The agentgateway subchart is not shipped yet (design 07 A1): P1 is the
# declared-ungoverned tier. The Gateway's name is fixed here because the
# route-authoring admission policy (design 07 A5.9) must know it before the
# Gateway exists, so that the first route anyone authors against it is already
# governed.
gateway:
  # false -- what P1 ships -- means the operator emits NOTHING at the gateway and
  # puts GovernanceSkipped=GatewayDisabled on every Agent (design 03 3.1).
  #
  # true runs design 03's first slice. The operator emits each Agent's serving
  # HTTPRoute, into the run namespace, attached to the Gateway named below, and
  # for a NEW Agent whose spec.expose.a2a.auth is apikey or absent, its
  # `<agent>-auth` AgentgatewayPolicy: API keys from the ConfigMaps labelled
  # assayd.dev/api-keys: "true" in the run namespace, admitting the group named
  # for the Agent's namespace. That route is published only after an anonymous
  # request through it gets 401, so `servingUrl` below is required. auth: none
  # is published at once, unauthenticated, and says so. No AgentgatewayBackend
  # is emitted and no budget, rate limit or tool allowlist is enforced.
  #
  # The Gateway API CRDs must be installed: with this true and them absent the
  # operator refuses to start rather than reporting everything is fine. The
  # chart does not install them and neither does it ship a Gateway (A1).
  enabled: false
  # The Gateway an emitted route's parentRef names. Fixed here because the
  # route-authoring admission policy must know it before the Gateway exists.
  #
  # The LISTENER is not configurable: an emitted route always attaches to the
  # listener named `http` (design 07 A5.3), because nothing in this chart renders
  # a Gateway and there is no value to read one from. Name your listener
  # something else and every route reports `NoMatchingParent`, every request
  # 404s, and the Agent still says Ready -- the operator does not read route
  # status. Said here because nothing else would say it.
  name: assayd
  # The base URL an agent's EGRESS traverses -- where it sends MCP tool calls.
  # The operator injects it into every agent as ASSAYD_GATEWAY_URL (design 02
  # 11), after the user's own env, so an Agent cannot override the variable
  # (admission also refuses the ASSAYD_ prefix). That is ALL it guarantees:
  # nothing restricts where an agent's egress actually goes. Empty -- the default -- injects
  # nothing. It is a URL an agent dials, so it must name a listener that
  # admits the tool routes (the e2e harness uses the Gateway's `tools`
  # listener); nothing checks that it does.
  url: ""
  # The base URL of the Gateway's SERVING listener -- the one each Agent's
  # `<agent>-serving` route attaches to (listener `http`), and NOT `url` above,
  # which names the listener agents send egress to. Design 03 3.3.3 sends the
  # compiler's anonymous `401` probe here, with the Agent's Host header.
  #
  # Rendered as --gateway-serving-url. REQUIRED whenever `enabled` is true:
  # the chart refuses to render without it, and the operator refuses to start.
  # The policy compiler publishes a new Agent's route only after an anonymous
  # request sent HERE, with the Agent's Host header, gets 401. The operator
  # refuses a value that is not an absolute http(s) URL naming only a host and
  # port, and checks nothing else. A URL that reaches no listener holds every
  # new Agent unpublished, and its Agents say so. A URL that reaches a
  # different listener, a proxy, or anything that answers 401 on its own, or a
  # Gateway carrying a Gateway-level auth policy, can answer the 401 the
  # Agent's own policy did not, and nothing detects that: design 03 §3.3.3
  # records it as open, and §8.1 owes the conformance case on the `http`
  # listener.
  servingUrl: ""
  # The namespace the Gateway object lives in, which is NOT the namespace the
  # operator runs in. Design 03 3.2 puts gateway-scoped resources in "the
  # gateway's own namespace", and agentgateway forces the separation anyway:
  # its v1.5.0 proxy sets no seccompProfile and AgentgatewayParameters cannot
  # supply one, so the proxy cannot run in assayd-system, which the chart
  # enforces as PodSecurity `restricted`.
  #
  # This is load-bearing, not cosmetic. assayd-gateway-routes reserves route
  # authorship by comparing the parentRef's namespace to THIS value; point it
  # at the wrong namespace and the reservation matches nothing and silently
  # permits any identity to attach a route. Measured: moving the Gateway out of
  # assayd-system while this read `.Values.namespace` let an ordinary test
  # identity attach one.
  #
  # Empty means `.Values.namespace` above -- the namespace the OPERATOR runs in,
  # which is where a single-namespace install puts everything. It is NOT the Helm
  # release namespace: hack/e2e.sh installs the release into `default` while the
  # operator runs in `assayd-system`, so this default must not be read as
  # "wherever you helm-installed to".
  #
  # With gateway.enabled, the chart also renders a Role and RoleBinding IN this
  # namespace (the operator's read of the gateway's NACK Events, design 03
  # 3.3), so it must exist before `helm install`, or the install fails.
  namespace: ""

  # The suffix appended to `<agent>.<agent-namespace>` to form the hostname the
  # emitted serving route matches. NO DESIGN SETTLES THIS: design 03 3.2 fixes
  # where the route lives and what names the object and says nothing about the
  # host it matches, so this is assayd's choice and it is configurable rather
  # than presented as the design's.
  #
  # It is a ROUTING KEY, matched against the request's Host header -- not an
  # address. Nothing in this chart creates DNS for it, so reaching an agent by
  # this name from outside the cluster needs a record an administrator provides.
  # `.internal` is ICANN-reserved for private use, so it cannot collide with a
  # name anyone can register.
  #
  # Set here rather than left to the binary's own default, and the template
  # renders the flag only when this is non-empty -- so an overlay that replaces
  # the whole `gateway:` map falls back to the operator's compiled-in default
  # instead of passing it an empty string.
  hostnameSuffix: assayd.internal

# Design 07 A5.9: the identities permitted to write the reserved assayd.dev
# namespace labels. The operator's own ServiceAccount is always permitted;
# list the tenant-operator's here when the enterprise module is installed.
# Every identity added is a principal that can mint a SPIFFE-selected
# namespace — keep it to assayd's own controllers.
admission:
  extraOperators: []
  # Design 03 3.4.4: who may write a ConfigMap labelled `assayd.dev/api-keys` in
  # a run namespace. Such a ConfigMap holds API-key hashes, and agentgateway
  # reads them live, so writing one mints a principal. The design says the key
  # set "is written by an administrator"; this names the administrators. The
  # operator's own ServiceAccount (and extraOperators) are always permitted.
  #
  # `system:masters` is the default because it is the one group this
  # reservation could not exclude anyway: its members bypass RBAC and can delete
  # the policy's binding. Every other administrator must be listed here, by
  # username or by group -- a `cluster-admin` binding alone is NOT enough, and
  # kubeadm (and so kind) puts its admin kubeconfig in `kubeadm:cluster-admins`,
  # not `system:masters`. Each identity added can mint a principal for any
  # Agent's group.
  apiKeyWriters:
    users: []
    groups: ["system:masters"]
