---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: agents.assayd.dev
spec:
  group: assayd.dev
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - ag
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.activeRevision
      name: Active
      type: string
    - jsonPath: .status.candidateRevision
      name: Candidate
      type: string
    - jsonPath: .status.eval.score
      name: Eval
      type: string
    - jsonPath: .status.budget.usdSpentToday
      name: Cost/Day
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Agent is any container that speaks A2A and serves an Agent Card.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentSpec is the platform's front door: it turns a container that speaks A2A
              into a governed, discoverable, eval-gated workload.

              Design 02 §3.1 (r3, integrated). Exactly one of Runtime or External is set.
            properties:
              budget:
                description: |-
                  Budget is REFUSED at admission (design 03 §3.1, ADR-0034 B2). Nothing
                  enforces a budget yet: no gateway rate limit is compiled and design 04's
                  spend aggregation does not exist, so an admitted budget would be a limit
                  the developer believes in and nothing applies. The type stays because an
                  Agent stored before the refusal may carry one, and the revision projection
                  still reads it. The refusal is removed in the change that ships
                  enforcement.
                properties:
                  maxHops:
                    format: int32
                    type: integer
                  taskTimeout:
                    type: string
                  tokensPerDay:
                    format: int64
                    type: integer
                  usdPerDay:
                    description: |-
                      USDPerDay compiles at the max price across allowed models; a model
                      matching no pricing pattern is a compile error (ADR-0020).
                    type: string
                type: object
              card:
                description: |-
                  Card locates the A2A Agent Card. The container is the source of truth
                  (ADR-0019): the operator fetches, validates and digests it per revision.
                properties:
                  path:
                    default: /.well-known/agent-card.json
                    type: string
                type: object
              expose:
                description: Expose publishes this agent beyond the cluster over open
                  standards.
                properties:
                  a2a:
                    description: |-
                      ExposeProtocol is one protocol's exposure. An a2a block must state its
                      authentication, and auth has no default (design 03 §3.4.4, ADR-0034 C2): a
                      default would choose the Agent's identity story — OAuth or shared bearer keys
                      — for a developer who never chose one, and the API server would write it into
                      every stored object, where nobody can tell it from a choice.
                    properties:
                      auth:
                        description: |-
                          Auth is how the Agent's route authenticates callers. It is required by a
                          CEL rule on the a2a block rather than by `required`, so the refusal names
                          the fix.

                            - apikey: API keys, admitting the one group named for this Agent's
                              namespace. There is no field that names another group (design 03 §1.1).
                            - none: an unauthenticated route.
                            - oauth: admitted, and not compilable until design 06 ships.

                          NOTHING ENFORCES ANY OF THESE YET. No controller reads this value except
                          to hash it into the revision, and the policy compiler that would turn
                          apikey into a gateway policy does not exist. With the gateway enabled,
                          every Agent's route is unauthenticated whatever this says, and
                          GovernanceSkipped reports it. An Agent stored while this field defaulted
                          carries auth: oauth whether or not a person chose it: removing a default
                          migrates nothing.
                        enum:
                        - none
                        - oauth
                        - apikey
                        type: string
                      visibility:
                        default: cluster
                        enum:
                        - cluster
                        - org
                        - public
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: 'spec.expose.a2a.auth is required and has no default:
                        set apikey (keys in the group named for this namespace), none
                        (an unauthenticated route), or oauth (not compilable until
                        design 06 ships)'
                      rule: has(self.auth)
                type: object
              external:
                description: |-
                  External registers an agent that runs outside this cluster. It receives no
                  SVID; it authenticates to the gateway with OAuth client credentials.
                properties:
                  endpoint:
                    pattern: ^https://
                    type: string
                  inlineCard:
                    description: Card may be inlined only where the external endpoint
                      cannot serve one.
                    type: string
                  oauthClientRef:
                    type: string
                required:
                - endpoint
                type: object
              gates:
                description: |-
                  Gates must pass before a candidate revision receives traffic (ADR-0006).
                  At least one is required in prod, iff the EvalSuite CRD is installed;
                  otherwise rollouts proceed with a loud GatesSkipped condition.
                items:
                  properties:
                    evalSuiteRef:
                      minLength: 1
                      type: string
                  required:
                  - evalSuiteRef
                  type: object
                type: array
              knowledge:
                description: |-
                  Knowledge binds pinned KnowledgeGraph versions. Scope is injected by the
                  gateway and enforced by the provider (design 01 A1) — the gateway never
                  parses MCP bodies.
                items:
                  description: |-
                    KnowledgeBinding pins one graph version. Binds are refused to versions that
                    are not active or superseded (design 01 A5.2).

                    The graph reference is inline rather than wrapped in a graphRef object: the
                    wrapper named a protocol, not a choice, so it nested without discriminating.
                    Compare ExposeSpec, whose arm does select between protocols and earns it.
                    Graphs resolve in the agent's own namespace, for the reason ToolBinding gives.
                  properties:
                    name:
                      minLength: 1
                      type: string
                    scope:
                      description: |-
                        Scope narrows what this agent may read: injected by the gateway, enforced
                        by the provider (design 01 A1).
                      properties:
                        entityTypes:
                          items:
                            type: string
                          type: array
                      type: object
                    version:
                      description: Version is pinned. "active" is permitted only in
                        the local profile.
                      minLength: 1
                      type: string
                  required:
                  - name
                  - version
                  type: object
                type: array
              llm:
                description: LLM declares model access. Designs 03, 20 and 25 compile
                  against this.
                properties:
                  egressAllowlist:
                    description: |-
                      EgressAllowlist may be pinned by a compliance profile (ADR-0014). It is the
                      permitted set; Providers must be a subset of it.
                    items:
                      description: |-
                        LLMAllowEntry is an endpoint identity with `models` in place of `model`: the
                        permitted set, which requested providers must be a subset of.
                      properties:
                        arm:
                          description: |-
                            LLMArm discriminates an endpoint identity. Design 02 A24: an endpoint is
                            `{arm, that arm's instance fields, model}` — NOT `(provider, model)`, which is
                            non-injective. Two Azure OpenAI resources share the arm and a model name while
                            differing in endpoint, deployment, region and BAA posture, so a flat string
                            cannot tell them apart: the compiler could not prove requested-is-a-subset-of-
                            permitted, design 20 could not target the right fallback, and price and drift
                            attribution had to guess (r8 BLOCKER 6).
                          enum:
                          - anthropic
                          - openai
                          - azureopenai
                          - vertexai
                          - bedrock
                          - custom
                          type: string
                        azureopenai:
                          description: |-
                            AzureOpenAIInstance is what distinguishes two Azure resources. Design 03
                            §3.4.1.1: this arm carries no `model` field, and at `apiVersion: v1` the model
                            may be supplied by the request — which is why a models-narrowed allowlist
                            entry is rejected for it unless a non-v1 deploymentName pins the identity.
                          properties:
                            apiVersion:
                              type: string
                            deploymentName:
                              type: string
                            endpoint:
                              minLength: 1
                              type: string
                          required:
                          - endpoint
                          type: object
                        bedrock:
                          properties:
                            guardrail:
                              type: string
                            region:
                              minLength: 1
                              type: string
                          required:
                          - region
                          type: object
                        custom:
                          properties:
                            host:
                              minLength: 1
                              type: string
                            pathPrefix:
                              type: string
                            port:
                              format: int32
                              type: integer
                          required:
                          - host
                          type: object
                        models:
                          description: Models narrows the entry. Absent means every
                            model this identity serves.
                          items:
                            type: string
                          type: array
                        vertexai:
                          properties:
                            projectId:
                              minLength: 1
                              type: string
                            region:
                              minLength: 1
                              type: string
                          required:
                          - projectId
                          - region
                          type: object
                      required:
                      - arm
                      type: object
                      x-kubernetes-validations:
                      - message: arm azureopenai requires an azureopenai instance
                          block; an arm-level entry names every Azure resource in
                          the tenant
                        rule: (self.arm == 'azureopenai') == has(self.azureopenai)
                      - message: arm vertexai requires a vertexai instance block
                        rule: (self.arm == 'vertexai') == has(self.vertexai)
                      - message: arm bedrock requires a bedrock instance block
                        rule: (self.arm == 'bedrock') == has(self.bedrock)
                      - message: arm custom requires a custom instance block
                        rule: (self.arm == 'custom') == has(self.custom)
                      - message: 'a models-narrowed entry is not enforceable on azureopenai
                          unless azureopenai.deploymentName pins the identity: at
                          apiVersion v1 the model may be supplied by the request,
                          so nothing in the emitted provider block constrains it (design
                          03 §3.4.1.1, A19)'
                        rule: self.arm != 'azureopenai' || !has(self.models) || (has(self.azureopenai)
                          && has(self.azureopenai.deploymentName))
                    type: array
                  fallback:
                    description: |-
                      Fallback is the ModelDrifted remediation target (design 20). It is a full
                      endpoint identity because design 20 A2 keys drift on one: an arm plus a
                      model name would let a canary against a healthy deployment clear drift on
                      the one that was actually drifting.
                    properties:
                      arm:
                        description: |-
                          LLMArm discriminates an endpoint identity. Design 02 A24: an endpoint is
                          `{arm, that arm's instance fields, model}` — NOT `(provider, model)`, which is
                          non-injective. Two Azure OpenAI resources share the arm and a model name while
                          differing in endpoint, deployment, region and BAA posture, so a flat string
                          cannot tell them apart: the compiler could not prove requested-is-a-subset-of-
                          permitted, design 20 could not target the right fallback, and price and drift
                          attribution had to guess (r8 BLOCKER 6).
                        enum:
                        - anthropic
                        - openai
                        - azureopenai
                        - vertexai
                        - bedrock
                        - custom
                        type: string
                      azureopenai:
                        description: |-
                          AzureOpenAIInstance is what distinguishes two Azure resources. Design 03
                          §3.4.1.1: this arm carries no `model` field, and at `apiVersion: v1` the model
                          may be supplied by the request — which is why a models-narrowed allowlist
                          entry is rejected for it unless a non-v1 deploymentName pins the identity.
                        properties:
                          apiVersion:
                            type: string
                          deploymentName:
                            type: string
                          endpoint:
                            minLength: 1
                            type: string
                        required:
                        - endpoint
                        type: object
                      bedrock:
                        properties:
                          guardrail:
                            type: string
                          region:
                            minLength: 1
                            type: string
                        required:
                        - region
                        type: object
                      custom:
                        properties:
                          host:
                            minLength: 1
                            type: string
                          pathPrefix:
                            type: string
                          port:
                            format: int32
                            type: integer
                        required:
                        - host
                        type: object
                      model:
                        description: |-
                          Model is carried by anthropic, openai, vertexai, bedrock and custom.
                          azureopenai does not have one — see the CEL rule above.
                        type: string
                      vertexai:
                        properties:
                          projectId:
                            minLength: 1
                            type: string
                          region:
                            minLength: 1
                            type: string
                        required:
                        - projectId
                        - region
                        type: object
                    required:
                    - arm
                    type: object
                    x-kubernetes-validations:
                    - message: 'arm azureopenai requires spec.llm…azureopenai (endpoint,
                        and deploymentName where the model is pinned), and no other
                        arm may set it: two Azure resources share the arm and a model
                        name while differing in endpoint, deployment and BAA posture'
                      rule: (self.arm == 'azureopenai') == has(self.azureopenai)
                    - message: arm vertexai requires spec.llm…vertexai (projectId,
                        region), and no other arm may set it
                      rule: (self.arm == 'vertexai') == has(self.vertexai)
                    - message: arm bedrock requires spec.llm…bedrock (region), and
                        no other arm may set it
                      rule: (self.arm == 'bedrock') == has(self.bedrock)
                    - message: arm custom requires spec.llm…custom (host), and no
                        other arm may set it
                      rule: (self.arm == 'custom') == has(self.custom)
                    - message: arm azureopenai carries no model field; the deployment
                        is the identity (design 03 §3.4.1.1). Set azureopenai.deploymentName
                        instead.
                      rule: self.arm != 'azureopenai' || !has(self.model)
                  providers:
                    description: Providers are endpoint IDENTITIES, not strings (A53).
                    items:
                      description: |-
                        LLMEndpoint is one endpoint identity: an arm, that arm's instance fields, and
                        a model where the arm carries one.

                        The instance block must match the arm, or the identity is not an identity —
                        an azureopenai entry with no instance names every Azure resource in the
                        tenant, which is the collapse this type exists to prevent.
                      properties:
                        arm:
                          description: |-
                            LLMArm discriminates an endpoint identity. Design 02 A24: an endpoint is
                            `{arm, that arm's instance fields, model}` — NOT `(provider, model)`, which is
                            non-injective. Two Azure OpenAI resources share the arm and a model name while
                            differing in endpoint, deployment, region and BAA posture, so a flat string
                            cannot tell them apart: the compiler could not prove requested-is-a-subset-of-
                            permitted, design 20 could not target the right fallback, and price and drift
                            attribution had to guess (r8 BLOCKER 6).
                          enum:
                          - anthropic
                          - openai
                          - azureopenai
                          - vertexai
                          - bedrock
                          - custom
                          type: string
                        azureopenai:
                          description: |-
                            AzureOpenAIInstance is what distinguishes two Azure resources. Design 03
                            §3.4.1.1: this arm carries no `model` field, and at `apiVersion: v1` the model
                            may be supplied by the request — which is why a models-narrowed allowlist
                            entry is rejected for it unless a non-v1 deploymentName pins the identity.
                          properties:
                            apiVersion:
                              type: string
                            deploymentName:
                              type: string
                            endpoint:
                              minLength: 1
                              type: string
                          required:
                          - endpoint
                          type: object
                        bedrock:
                          properties:
                            guardrail:
                              type: string
                            region:
                              minLength: 1
                              type: string
                          required:
                          - region
                          type: object
                        custom:
                          properties:
                            host:
                              minLength: 1
                              type: string
                            pathPrefix:
                              type: string
                            port:
                              format: int32
                              type: integer
                          required:
                          - host
                          type: object
                        model:
                          description: |-
                            Model is carried by anthropic, openai, vertexai, bedrock and custom.
                            azureopenai does not have one — see the CEL rule above.
                          type: string
                        vertexai:
                          properties:
                            projectId:
                              minLength: 1
                              type: string
                            region:
                              minLength: 1
                              type: string
                          required:
                          - projectId
                          - region
                          type: object
                      required:
                      - arm
                      type: object
                      x-kubernetes-validations:
                      - message: 'arm azureopenai requires spec.llm…azureopenai (endpoint,
                          and deploymentName where the model is pinned), and no other
                          arm may set it: two Azure resources share the arm and a
                          model name while differing in endpoint, deployment and BAA
                          posture'
                        rule: (self.arm == 'azureopenai') == has(self.azureopenai)
                      - message: arm vertexai requires spec.llm…vertexai (projectId,
                          region), and no other arm may set it
                        rule: (self.arm == 'vertexai') == has(self.vertexai)
                      - message: arm bedrock requires spec.llm…bedrock (region), and
                          no other arm may set it
                        rule: (self.arm == 'bedrock') == has(self.bedrock)
                      - message: arm custom requires spec.llm…custom (host), and no
                          other arm may set it
                        rule: (self.arm == 'custom') == has(self.custom)
                      - message: arm azureopenai carries no model field; the deployment
                          is the identity (design 03 §3.4.1.1). Set azureopenai.deploymentName
                          instead.
                        rule: self.arm != 'azureopenai' || !has(self.model)
                    type: array
                type: object
              loop:
                description: |-
                  Loop bounds re-entry for this agent. Enforcement is stateless in-proxy CEL
                  over a gateway-owned lineage header (design 22).
                properties:
                  allowReentry:
                    description: AllowReentry opts into bounded revisits. Default
                      is any-revisit-denied.
                    type: boolean
                  maxVisits:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              release:
                description: |-
                  Release selects which revision serves, when that is not simply the one
                  this spec computes to (ADR-0031 decision 2).
                properties:
                  targetRevisionDigest:
                    description: |-
                      TargetRevisionDigest pins the release to a retained revision, named by its
                      FULL SHA-256 — never the 40-bit workload name, which a chosen collision can
                      forge (A57). Unset means follow the ordinary desired spec.

                      The pinned revision is SELECTED, never recomputed: the operator serves the
                      retained material that revision was evaluated with, which is the whole
                      point under source drift.
                    pattern: ^[0-9a-f]{64}$
                    type: string
                type: object
              runtime:
                description: Runtime describes an in-cluster agent workload.
                properties:
                  env:
                    description: Env carries non-secret values only; secrets arrive
                      via EnvFrom.
                    items:
                      description: EnvVar represents an environment variable present
                        in a Container.
                      properties:
                        name:
                          description: |-
                            Name of the environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        value:
                          description: |-
                            Variable references $(VAR_NAME) are expanded
                            using the previously defined environment variables in the container and
                            any service environment variables. If a variable cannot be resolved,
                            the reference in the input string will be unchanged. Double $$ are reduced
                            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                            "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                            Escaped references will never be expanded, regardless of whether the variable
                            exists or not.
                            Defaults to "".
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                            Cannot be used if value is not empty.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  description: The key to select.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the ConfigMap or its
                                    key must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              description: |-
                                Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                              properties:
                                apiVersion:
                                  description: Version of the schema the FieldPath
                                    is written in terms of, defaults to "v1".
                                  type: string
                                fieldPath:
                                  description: Path of the field to select in the
                                    specified API version.
                                  type: string
                              required:
                              - fieldPath
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              description: |-
                                FileKeyRef selects a key of the env file.
                                Requires the EnvFiles feature gate to be enabled.
                              properties:
                                key:
                                  description: |-
                                    The key within the env file. An invalid key will prevent the pod from starting.
                                    The keys defined within a source may consist of any printable ASCII characters except '='.
                                    During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                  type: string
                                optional:
                                  default: false
                                  description: |-
                                    Specify whether the file or its key must be defined. If the file or key
                                    does not exist, then the env var is not published.
                                    If optional is set to true and the specified key does not exist,
                                    the environment variable will not be set in the Pod's containers.

                                    If optional is set to false and the specified key does not exist,
                                    an error will be returned during Pod creation.
                                  type: boolean
                                path:
                                  description: |-
                                    The path within the volume from which to select the file.
                                    Must be relative and may not contain the '..' path or start with '..'.
                                  type: string
                                volumeName:
                                  description: The name of the volume mount containing
                                    the env file.
                                  type: string
                              required:
                              - key
                              - path
                              - volumeName
                              type: object
                              x-kubernetes-map-type: atomic
                            resourceFieldRef:
                              description: |-
                                Selects a resource of the container: only resources limits and requests
                                (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                              properties:
                                containerName:
                                  description: 'Container name: required for volumes,
                                    optional for env vars'
                                  type: string
                                divisor:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: Specifies the output format of the
                                    exposed resources, defaults to "1"
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                resource:
                                  description: 'Required: resource to select'
                                  type: string
                              required:
                              - resource
                              type: object
                              x-kubernetes-map-type: atomic
                            secretKeyRef:
                              description: Selects a key of a secret in the pod's
                                namespace
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
                                    must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  envFrom:
                    items:
                      description: EnvFromSource represents the source of a set of
                        ConfigMaps or Secrets
                      properties:
                        configMapRef:
                          description: The ConfigMap to select from
                          properties:
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap must be defined
                              type: boolean
                          type: object
                          x-kubernetes-map-type: atomic
                        prefix:
                          description: |-
                            Optional text to prepend to the name of each environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        secretRef:
                          description: The Secret to select from
                          properties:
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
