---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: evalsuites.assayd.dev
spec:
  group: assayd.dev
  names:
    kind: EvalSuite
    listKind: EvalSuiteList
    plural: evalsuites
    singular: evalsuite
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EvalSuite is the set of cases a gated Agent's candidate revision must pass
          before it takes traffic (design 16 §1.1).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EvalSuiteSpec is design 16 §1.1's slice of the EvalSuite: a list of cases,
              at most one metric, and a per-case timeout. It is a strict subset of design
              16 §3's schema (Q8 (a)), so the full schema can add fields without migrating
              a stored suite. Every other §3 field — runner, target, dataset.goldenSetRef,
              dataset.fromSessions, gate, budget — is absent, and the API server prunes or
              refuses it as it does any unknown field.

              An Agent binds a suite through spec.gates[].evalSuiteRef, in the Agent's own
              namespace; the suite names no Agent.

              The operator's eval controller sends each case to a gated candidate and
              writes the verdict to the Agent's status.eval. The Agent reconciler reads
              the suite a gate names and promotes a candidate only once status.eval
              records a Passed verdict for it against this suite's digest, with its card
              recorded; until then it holds, under GatesPassed=False/EvalRunning while the
              run goes on.
            properties:
              caseTimeoutSeconds:
                default: 10
                description: |-
                  CaseTimeoutSeconds bounds each case's request to the candidate. A case
                  with no answer within it fails, reason Unreachable.
                format: int32
                maximum: 10
                minimum: 1
                type: integer
              dataset:
                description: Dataset holds the cases each candidate revision is sent.
                properties:
                  cases:
                    description: 'Cases are sent one A2A task each: 1 to 20, with
                      unique ids.'
                    items:
                      description: EvalCase is one task sent to the candidate, and
                        what its answer must hold.
                      properties:
                        expect:
                          description: Expect is what the answer text must satisfy.
                          properties:
                            contains:
                              description: Contains passes the case when the answer
                                text contains it.
                              maxLength: 512
                              minLength: 1
                              type: string
                            equals:
                              description: Equals passes the case when the answer
                                text is exactly it.
                              maxLength: 512
                              minLength: 1
                              type: string
                          type: object
                          x-kubernetes-validations:
                          - message: spec.dataset.cases[].expect must set exactly
                              one of contains or equals.
                            rule: has(self.contains) != has(self.equals)
                        id:
                          description: ID names the case in status.eval.cases[]. A
                            DNS label.
                          maxLength: 63
                          type: string
                          x-kubernetes-validations:
                          - message: 'spec.dataset.cases[].id must be a DNS label:
                              lowercase letters, digits and ''-'', starting and ending
                              with a letter or digit, at most 63 characters.'
                            rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
                        message:
                          description: Message is sent as the task's one text part.
                          maxLength: 4096
                          minLength: 1
                          type: string
                      required:
                      - expect
                      - id
                      - message
                      type: object
                      x-kubernetes-validations:
                      - message: this case's message already satisfies its own expectation,
                          so an agent that echoes its input would pass it. Change
                          the expectation to something only a correct answer contains.
                        rule: (!has(self.expect.contains) || !self.message.contains(self.expect.contains))
                          && (!has(self.expect.equals) || self.message != self.expect.equals)
                    maxItems: 20
                    type: array
                    x-kubernetes-validations:
                    - message: 'spec.dataset.cases is empty, and an eval with no cases
                        would pass every revision. Add at least one case: {id, message,
                        expect: {contains or equals}}.'
                      rule: self.size() >= 1
                    - message: 'spec.dataset.cases[].id must be unique within the
                        suite: each case''s outcome is recorded by its id. Rename
                        the duplicate.'
                      rule: self.all(c, self.exists_one(d, d.id == c.id))
                required:
                - cases
                type: object
              metrics:
                description: |-
                  Metrics holds at most one metric, task_completion: the share of cases
                  that must pass. With no metric, every case must pass (threshold "1").
                items:
                  description: EvalMetric is the slice's one metric.
                  properties:
                    name:
                      description: Name must be task_completion.
                      type: string
                      x-kubernetes-validations:
                      - message: 'spec.metrics[].name must be task_completion: it
                          is the only metric in this release (design 16 §1.1).'
                        rule: self == 'task_completion'
                    threshold:
                      description: |-
                        Threshold is the share of cases that must pass: a decimal string greater
                        than 0 and at most 1, with at most three decimal places. It is a string
                        because a float field cannot be compared exactly; the operator compares
                        in integer thousandths.

                        MaxLength is a cost bound for the CEL rules, set above any plausible
                        over-precise input so that "0.6666" reaches the format rule's message
                        rather than a bare "too long": the API server skips CEL once a length
                        bound fails.
                      maxLength: 16
                      type: string
                      x-kubernetes-validations:
                      - message: spec.metrics[].threshold must be a decimal string
                          from 0 to 1 with at most three decimal places, such as 0.66
                          or 1.
                        rule: self.matches('^(0([.][0-9]{1,3})?|1([.]0{1,3})?)$')
                      - message: 'spec.metrics[].threshold must be greater than 0:
                          a threshold of 0 would pass every revision.'
                        rule: '!self.matches(''^0([.]0{1,3})?$'')'
                  required:
                  - name
                  - threshold
                  type: object
                maxItems: 1
                type: array
            required:
            - dataset
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
