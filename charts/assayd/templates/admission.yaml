{{- include "assayd.validate" . -}}
# Design 07 A5.9: the assayd.dev namespace labels are reserved to the operator.
#
# Three consumers act on those labels and none of them reads the operator's
# binding record: SPIRE selects on assayd.dev/pods-by, the Gateway admits routes
# on assayd.dev/run-namespace, and the operator's own Namespace reconciler keys
# on both. A label is writable by whoever can create or update the namespace,
# so without this policy the labels are a convention and a namespace-create
# principal could mint a SPIFFE-selected namespace the operator never made.
# The operator fail-closes when this policy is absent (RunNamespaceUnavailable=
# LabelAuthorityAbsent), so it must render on every install.
#
# ValidatingAdmissionPolicy is GA from Kubernetes 1.30, Chart.yaml's floor.
{{- /*
The identities permitted to write the reserved labels are rendered INTO the
CEL, not read from a params object: a params ConfigMap that goes missing —
`kubectl delete ns assayd-system` with the policies still bound — would have
denied every namespace create and update in the cluster (parameterNotFoundAction
cannot be anything but Deny for a policy this policy is). The operator's own
ServiceAccount is always here; admission.extraOperators adds the tenant-operator
(design 26 A1), the only hard-mode writer of run-namespace/tenant-sync.
*/ -}}
{{- $operators := list (printf "system:serviceaccount:%s:%s" .Values.namespace (include "assayd.operator.name" .)) -}}
{{- range .Values.admission.extraOperators }}{{ $operators = append $operators . }}{{ end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: assayd-namespace-labels
  labels:
    {{- include "assayd.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        # The status and finalize subresources also write metadata; a label set
        # through either slips past a rule that names only the main resource.
        resources: ["namespaces", "namespaces/status", "namespaces/finalize"]
  variables:
    - name: reserved
      expression: "['assayd.dev/pods-by', 'assayd.dev/run-namespace', 'assayd.dev/tenant-sync', 'assayd.dev/agent-namespace', 'assayd.dev/owned-by']"
    - name: newLabels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
    - name: oldLabels
      expression: "oldObject == null || !has(oldObject.metadata.labels) ? {} : oldObject.metadata.labels"
    - name: newNonce
      expression: "has(object.metadata.annotations) && 'assayd.dev/binding-nonce' in object.metadata.annotations ? object.metadata.annotations['assayd.dev/binding-nonce'] : ''"
    - name: oldNonce
      expression: "oldObject != null && has(oldObject.metadata.annotations) && 'assayd.dev/binding-nonce' in oldObject.metadata.annotations ? oldObject.metadata.annotations['assayd.dev/binding-nonce'] : ''"
    - name: touched
      expression: "variables.reserved.exists(k, (k in variables.newLabels ? variables.newLabels[k] : '') != (k in variables.oldLabels ? variables.oldLabels[k] : '')) || variables.newNonce != variables.oldNonce"
    - name: operator
      expression: {{ printf "request.userInfo.username in %s" (toJson $operators) | quote }}
  validations:
    - expression: "!variables.touched || variables.operator"
      message: "assayd.dev namespace labels and the assayd.dev/binding-nonce annotation are reserved to the assayd operators (design 07 A5.9)"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: assayd-namespace-labels
  labels:
    {{- include "assayd.labels" . | nindent 4 }}
spec:
  policyName: assayd-namespace-labels
  validationActions: ["Deny"]
---
{{- /*
The GATEWAY's namespace, which is not the operator's. This read
`.Values.namespace` until an e2e moved the Gateway to its own namespace and an
ordinary identity then attached a route: the CEL compared against the operator's
namespace, `targetsAssayd` went false, and the reservation matched nothing.
Fail-open, and silent -- the route is simply accepted.

The serving listener is the operator's constant GatewayListenerName
(internal/controller/httproute.go), not a value: nothing in this chart renders a
Gateway, so there is nothing to read it from (values.yaml, beside gateway.name).
The chart test holds the two equal. The hostname suffix is the one the operator
is given, with the operator's own default when the value is empty, as
operator.yaml and NOTES.txt fall back to it.
*/ -}}
{{- $gwNS := .Values.gateway.namespace | default .Values.namespace -}}
{{- $serving := "http" -}}
{{- $suffix := .Values.gateway.hostnameSuffix | default "assayd.internal" | lower -}}
{{- $toolWriters := .Values.admission.toolRouteWriters | default dict -}}
{{- $toolUsers := $toolWriters.users | default list -}}
{{- $toolGroups := $toolWriters.groups | default list -}}
{{- $gatewayRef := printf "p.name == %s && (has(p.namespace) ? p.namespace : request.namespace) == %s" (.Values.gateway.name | toJson) ($gwNS | toJson) -}}
# A namespace the Gateway listener admits is not a grant to author routes into
# it (design 07 A5.3/A5.9). An HTTPRoute or GRPCRoute whose parentRefs name the
# assayd Gateway publishes a path to a workload, so writing one is reserved:
#
#   * on the SERVING listener `http`, and through a parentRef that names no
#     sectionName and so attaches to every listener, to the operator and
#     admission.extraOperators only;
#   * on any other listener, also to admission.toolRouteWriters (design 07
#     A6.15), whose routes must list their hostnames, none of them one an
#     Agent's serving host could match: on a listener that shares the serving
#     port, a route matching `<agent>.<namespace>.<suffix>` would take that
#     Agent's traffic.
#
# The old object is judged as well as the new one, so an UPDATE cannot take a
# route off the serving listener either. What is reserved is what the route
# SAYS -- its spec, labels and annotations -- and additions to the metadata
# that decides when it goes, as for assayd-gateway-policies: the garbage
# collector finishes a foreground delete by an UPDATE that removes a finalizer,
# and refusing it would leave the route, and its Agent's teardown, Terminating
# forever. DELETE is RBAC's (design 07 A6.10). Matches nothing until the
# Gateway API CRDs are installed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: assayd-gateway-routes
  labels:
    {{- include "assayd.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        # A GRPCRoute attaches to an HTTP listener as an HTTPRoute does, with
        # the same parentRefs and hostnames, so it is the same capability.
        resources: ["httproutes", "grpcroutes"]
  variables:
    # The parentRefs that name the assayd Gateway. A parentRef without a
    # namespace refers to the ROUTE's namespace (Gateway API), so a bare-name
    # ref from inside the Gateway's namespace targets it too; request.namespace
    # is the route's.
    - name: attached
      expression: {{ printf "has(object.spec.parentRefs) ? object.spec.parentRefs.filter(p, %s) : []" $gatewayRef | quote }}
    - name: wasAttached
      expression: {{ printf "oldObject != null && has(oldObject.spec.parentRefs) ? oldObject.spec.parentRefs.filter(p, %s) : []" $gatewayRef | quote }}
    - name: targetsAssayd
      expression: "size(variables.attached) > 0 || size(variables.wasAttached) > 0"
    # A parentRef with no sectionName attaches to every listener it can, the
    # serving one included, whatever port it names.
    - name: serving
      expression: {{ printf "variables.attached.exists(p, !has(p.sectionName) || p.sectionName == %s) || variables.wasAttached.exists(p, !has(p.sectionName) || p.sectionName == %s)" ($serving | toJson) ($serving | toJson) | quote }}
    # Every hostname is clear of the serving hosts `<agent>.<namespace>.<suffix>`:
    # not the suffix, not under it, and not a wildcard at or above it. No
    # hostnames at all matches every host.
    - name: hostsClear
      expression: {{ printf "has(object.spec.hostnames) && size(object.spec.hostnames) > 0 && object.spec.hostnames.all(h, !(h == %s || h.endsWith('.' + %s) || (h.startsWith('*.') && ('.' + %s).endsWith(h.substring(1)))))" ($suffix | toJson) ($suffix | toJson) ($suffix | toJson) | quote }}
    - name: operator
      expression: {{ printf "request.userInfo.username in %s" (toJson $operators) | quote }}
    - name: toolWriter
      expression: {{ printf "request.userInfo.username in %s || (has(request.userInfo.groups) && request.userInfo.groups.exists(g, g in %s))" (toJson $toolUsers) (toJson $toolGroups) | quote }}
    - name: addedFinalizer
      expression: "has(object.metadata.finalizers) && object.metadata.finalizers.exists(f, oldObject == null || !has(oldObject.metadata.finalizers) || !(f in oldObject.metadata.finalizers))"
    - name: addedOwner
      expression: "has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(o, oldObject == null || !has(oldObject.metadata.ownerReferences) || !oldObject.metadata.ownerReferences.exists(p, p.uid == o.uid && p.apiVersion == o.apiVersion && p.kind == o.kind && p.name == o.name))"
    - name: touched
      expression: "oldObject == null || object.spec != oldObject.spec || (has(object.metadata.labels) ? object.metadata.labels : {}) != (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) || (has(object.metadata.annotations) ? object.metadata.annotations : {}) != (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}) || variables.addedFinalizer || variables.addedOwner"
  validations:
    - expression: "!variables.touched || !variables.targetsAssayd || variables.operator || variables.toolWriter"
      message: "routes attaching to the assayd Gateway are authored by the assayd operator, and on listeners other than `{{ $serving }}` by the identities in admission.toolRouteWriters (design 07 A5.9, A6.15)"
      reason: Forbidden
    - expression: "!variables.touched || variables.operator || !variables.serving"
      message: "the assayd Gateway's serving listener `{{ $serving }}` is the assayd operator's alone: a route naming it, or naming the Gateway with no sectionName and so attaching to every listener, before or after this write, is refused; give a tool route the sectionName of another listener (design 07 A6.15)"
      reason: Forbidden
    - expression: "!variables.touched || variables.operator || size(variables.attached) == 0 || variables.hostsClear"
      message: "a tool route on the assayd Gateway must list its hostnames, and none may match an Agent's serving host `<agent>.<namespace>.{{ $suffix }}`: on a listener that shares the serving port it would take that Agent's traffic (design 07 A6.15)"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: assayd-gateway-routes
  labels:
    {{- include "assayd.labels" . | nindent 4 }}
spec:
  policyName: assayd-gateway-routes
  validationActions: ["Deny"]
---
{{- /*
Design 03 §6 and §1.1: the third reservation, and the key-source label's beside
it. Both are scoped to run namespaces by the label assayd-namespace-labels
reserves to the operator, so a tenant cannot bring a namespace into or out of
their reach. A run namespace is the only place an AgentgatewayPolicy can reach
an Agent's route (a policy's targetRefs select same-namespace objects only,
design 03 §3.2), and the only placement of a key ConfigMap that has been
measured (§3.4.4).
*/ -}}
# An AgentgatewayPolicy in a run namespace is authored by the assayd operator
# only (design 03 §6). A `traffic` policy on an Agent's serving route decides
# who may call that Agent, and two same-level policies on one target resolve at
# random per replica and per restart (§3.2), so anyone who could write one
# beside the operator's `<agent>-auth` would control what the route admits.
#
# CREATE and UPDATE, the operations §6 names. DELETE is not reserved: who may
# delete a policy is an RBAC question, as it is for routes (design 07 A6.10), and
# reserving it would also refuse the namespace controller's own deletes when a
# run namespace is torn down. A policy deleted out of band is §3.3.3's
# `AuthPolicyMissing`, which the compiler re-creates; no compiler exists yet.
# The `status` subresource is not matched: the gateway's controller writes it,
# and a custom resource's /status ignores every change outside `status`.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: assayd-gateway-policies
  labels:
    {{- include "assayd.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        assayd.dev/run-namespace: "true"
    resourceRules:
      - apiGroups: ["agentgateway.dev"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["agentgatewaypolicies"]
  variables:
    - name: operator
      expression: {{ printf "request.userInfo.username in %s" (toJson $operators) | quote }}
    # What is reserved is what the policy SAYS, its spec, and the labels that
    # make it the operator's (design 03 §3.2's name-and-label rule). An UPDATE
    # that changes neither is admitted, because the garbage collector finishes
    # a foreground or orphan delete by removing its finalizer with an UPDATE,
    # and refusing it left the policy Terminating forever, and with it the
    # teardown of the Agent it belongs to.
    # Metadata that decides when the object GOES is reserved too, but only its
    # additions. A finalizer added by a non-operator stalls the operator's
    # teardown for as long as its author likes; an ownerReference added to an
    # object that does not exist lets the garbage collector delete it. Removals
    # are admitted, which is all the garbage collector and the namespace
    # controller ever do.
    - name: addedFinalizer
      expression: "has(object.metadata.finalizers) && object.metadata.finalizers.exists(f, oldObject == null || !has(oldObject.metadata.finalizers) || !(f in oldObject.metadata.finalizers))"
    - name: addedOwner
      expression: "has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(o, oldObject == null || !has(oldObject.metadata.ownerReferences) || !oldObject.metadata.ownerReferences.exists(p, p.uid == o.uid && p.apiVersion == o.apiVersion && p.kind == o.kind && p.name == o.name))"
    - name: touched
      expression: "oldObject == null || object.spec != oldObject.spec || (has(object.metadata.labels) ? object.metadata.labels : {}) != (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) || variables.addedFinalizer || variables.addedOwner"
  validations:
    - expression: "!variables.touched || variables.operator"
      message: "AgentgatewayPolicies in assayd run namespaces are authored by the assayd operator only (design 03 §6)"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: assayd-gateway-policies
  labels:
    {{- include "assayd.labels" . | nindent 4 }}
spec:
  policyName: assayd-gateway-policies
  validationActions: ["Deny"]
---
{{- /*
The writers of a key set are the operator (design 03 §8.1 names it "a permitted
writer", for Narrow's probe keys, which are out of the slice) AND an
administrator, because §3.4.4 says the key set "is written by an administrator
and never emitted". So this cannot be the operator alone the way the policy
reservation is: that would leave no one able to issue a key. Who the
administrator is, the design does not say; admission.apiKeyWriters names them.
*/ -}}
{{- $writers := .Values.admission.apiKeyWriters | default dict -}}
{{- $keyUsers := concat $operators ($writers.users | default list) -}}
{{- $keyGroups := $writers.groups | default list -}}
# A ConfigMap carrying `assayd.dev/api-keys` in a run namespace holds API-key
# hashes, and agentgateway reads them live: adding an entry mints a principal
# with no compile, no revision and no comparator (design 03 §3.4.4). So writing
# one is reserved to the operator and to the administrators named in
# admission.apiKeyWriters. The label is reserved whatever its VALUE, because a
# later key source may select another value (§3.4.4's `gateway.apiKeys.selector`).
# The old object is checked as well as the new one, so removing the label from a
# key set, or adding it to an ordinary ConfigMap, is a write to a key set.
#
# Run namespaces only. Whether a `configMapSelector` reaches a ConfigMap in
# another namespace is UNMEASURED (§3.4.4), so outside them this label is not
# reserved, and a cross-namespace selector would be a bypass this does not close.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: assayd-api-keys
  labels:
    {{- include "assayd.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        assayd.dev/run-namespace: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["configmaps"]
  variables:
    - name: labelled
      expression: "(has(object.metadata.labels) && 'assayd.dev/api-keys' in object.metadata.labels) || (oldObject != null && has(oldObject.metadata.labels) && 'assayd.dev/api-keys' in oldObject.metadata.labels)"
    - name: writer
      expression: {{ printf "request.userInfo.username in %s || (has(request.userInfo.groups) && request.userInfo.groups.exists(g, g in %s))" (toJson $keyUsers) (toJson $keyGroups) | quote }}
    # What is reserved is what a key set holds, its data and binary data, and
    # its labels, which decide whether it is one. An UPDATE that changes none of
    # them is admitted, for the reason assayd-gateway-policies gives: the
    # garbage collector removes a foreground or orphan finalizer by UPDATE.
    # Metadata that decides when the object GOES is reserved too, but only its
    # additions. A finalizer added by a non-operator stalls the operator's
    # teardown for as long as its author likes; an ownerReference added to an
    # object that does not exist lets the garbage collector delete it. Removals
    # are admitted, which is all the garbage collector and the namespace
    # controller ever do.
    - name: addedFinalizer
      expression: "has(object.metadata.finalizers) && object.metadata.finalizers.exists(f, oldObject == null || !has(oldObject.metadata.finalizers) || !(f in oldObject.metadata.finalizers))"
    - name: addedOwner
      expression: "has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(o, oldObject == null || !has(oldObject.metadata.ownerReferences) || !oldObject.metadata.ownerReferences.exists(p, p.uid == o.uid && p.apiVersion == o.apiVersion && p.kind == o.kind && p.name == o.name))"
    # And `immutable`, either way: set, it freezes a key set against revocation;
    # the API server refuses to unset it, so that direction is its guard, not ours.
    - name: touched
      expression: "oldObject == null || (has(object.data) ? object.data : {}) != (has(oldObject.data) ? oldObject.data : {}) || (has(object.binaryData) ? object.binaryData : {}) != (has(oldObject.binaryData) ? oldObject.binaryData : {}) || (has(object.metadata.labels) ? object.metadata.labels : {}) != (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) || (has(object.immutable) ? object.immutable : false) != (has(oldObject.immutable) ? oldObject.immutable : false) || variables.addedFinalizer || variables.addedOwner"
  validations:
    - expression: "!variables.labelled || !variables.touched || variables.writer"
      message: "ConfigMaps labelled assayd.dev/api-keys in assayd run namespaces mint gateway principals; only the assayd operator and the identities in admission.apiKeyWriters may write them (design 03 §3.4.4)"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: assayd-api-keys
  labels:
    {{- include "assayd.labels" . | nindent 4 }}
spec:
  policyName: assayd-api-keys
  validationActions: ["Deny"]
