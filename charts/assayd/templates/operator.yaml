{{- include "assayd.validate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "assayd.operator.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "assayd.labels" . | nindent 4 }}
# The operator reads its own token from the projected volume the API client
# mounts; it does not need one automounted into every container.
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "assayd.operator.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "assayd.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-operator
spec:
  replicas: {{ if eq .Values.profile "local" }}1{{ else }}{{ .Values.operator.replicas }}{{ end }}
  # maxSurge 0 / maxUnavailable 1 — the OLD pod goes away before the new one
  # starts, and that ordering is required rather than preferred.
  #
  # Readiness is gated on leader election (cmd/operator: the "reconciling"
  # readyz check waits for mgr.Elected). With the default RollingUpdate the new
  # pod is created first and cannot become ready until it holds the lease, while
  # the old pod holds the lease and cannot be terminated until the new one is
  # ready. That deadlocks every upgrade until the rollout times out.
  #
  # Measured 2026-09-01: the deadlock is real, and it had been invisible because
  # e2e reused one image tag and so never rolled the pod at all.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "assayd.operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "assayd.operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "assayd.operator.name" . }}
      # The operator is held to the standard it holds agents to. A control plane
      # that hardens its workloads and not itself is making an argument it does
      # not believe.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: operator
          image: {{ include "assayd.operator.image" . | quote }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          # Where the run-namespace binding records live (design 02 A60): the
          # operator's own namespace, from the downward API rather than a value
          # that could disagree with where the Pod actually runs.
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          args:
            - --leader-elect={{ .Values.operator.leaderElection }}
            - --operator-namespace=$(POD_NAMESPACE)
            - --eval-suite-check-interval={{ .Values.operator.evalSuiteCheckInterval }}
            # Design 03 3.1: whether anything is emitted at the gateway is
            # DECLARED, never discovered. gateway.namespace defaults to the
            # operator's exactly as admission.yaml's $gwNS does, so the route the
            # operator authors and the policy that reserves route authorship
            # can never name two different namespaces -- which is the failure
            # design 07 A6.2 measured, silent and in the permissive direction.
            - --gateway-enabled={{ .Values.gateway.enabled }}
            - --gateway-name={{ .Values.gateway.name }}
            - --gateway-namespace={{ .Values.gateway.namespace | default .Values.namespace }}
            {{- with .Values.gateway.hostnameSuffix }}
            - --gateway-hostname-suffix={{ . }}
            {{- end }}
            {{- with .Values.gateway.url }}
            # Injected into every agent as ASSAYD_GATEWAY_URL (design 02 11), the
            # base URL its egress -- tool calls -- must traverse. Unset injects
            # nothing, which is what an install with no Gateway should do.
            - --gateway-url={{ . }}
            {{- end }}
            {{- if and .Values.gateway.enabled (not .Values.gateway.servingUrl) }}
            {{- fail "gateway.enabled is true and gateway.servingUrl is empty. The operator publishes a new Agent's route only after an anonymous request to the Gateway's serving listener gets 401 (design 03 3.3.3), and refuses to start without its address: set gateway.servingUrl to the listener <agent>-serving attaches to (listener http)" }}
            {{- end }}
            {{- with .Values.gateway.servingUrl }}
            # The Gateway's SERVING listener, where design 03 3.3.3's anonymous
            # probe goes. Required with the gateway enabled, and validated at
            # startup.
            - --gateway-serving-url={{ . }}
            {{- end }}
            - --health-probe-bind-address=:8081
            {{- if .Values.operator.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.operator.metrics.port }}
            {{- else }}
            # Off rather than unauthenticated on all interfaces.
            - --metrics-bind-address=0
            {{- end }}
          ports:
            - name: probes
              containerPort: 8081
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          # Readiness means "this process is reconciling", not "a listener
          # exists": it fails until leader election completes, so an operator
          # that cannot acquire its lease is visibly not ready rather than
          # silently idle.
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.operator.affinity }}
      affinity: {{- toYaml .Values.operator.affinity | nindent 8 }}
      {{- else if ne .Values.profile "local" }}
      # Soft rather than required: on a small prod cluster a hard rule would
      # leave the second replica Pending forever, which is a worse failure than
      # co-location. An operator with its own topology rules replaces this by
      # setting operator.affinity.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "assayd.operator.selectorLabels" . | nindent 20 }}
      {{- end }}
