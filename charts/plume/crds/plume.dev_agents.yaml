---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: agents.plume.dev
spec:
  group: plume.dev
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - ag
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.activeRevision
      name: Active
      type: string
    - jsonPath: .status.candidateRevision
      name: Candidate
      type: string
    - jsonPath: .status.eval.score
      name: Eval
      type: string
    - jsonPath: .status.budget.usdSpentToday
      name: Cost/Day
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Agent is any container that speaks A2A and serves an Agent Card.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentSpec is the platform's front door: it turns a container that speaks A2A
              into a governed, discoverable, eval-gated workload.

              Design 02 §3.1 (r3, integrated). Exactly one of Runtime or External is set.
            properties:
              budget:
                description: |-
                  Budget is enforced in two tiers (ADR-0020): the gateway applies a
                  conservative local approximation, and design 04's receipt aggregate is the
                  exact tier. Per-day windows reset at 00:00 UTC.
                properties:
                  maxHops:
                    format: int32
                    type: integer
                  taskTimeout:
                    type: string
                  tokensPerDay:
                    format: int64
                    type: integer
                  usdPerDay:
                    description: |-
                      USDPerDay compiles at the max price across allowed models; a model
                      matching no pricing pattern is a compile error (ADR-0020).
                    type: string
                type: object
              card:
                description: |-
                  Card locates the A2A Agent Card. The container is the source of truth
                  (ADR-0019): the operator fetches, validates and digests it per revision.
                properties:
                  path:
                    default: /.well-known/agent-card.json
                    type: string
                type: object
              expose:
                description: Expose publishes this agent beyond the cluster over open
                  standards.
                properties:
                  a2a:
                    properties:
                      auth:
                        default: oauth
                        enum:
                        - none
                        - oauth
                        type: string
                      visibility:
                        default: cluster
                        enum:
                        - cluster
                        - org
                        - public
                        type: string
                    type: object
                type: object
              external:
                description: |-
                  External registers an agent that runs outside this cluster. It receives no
                  SVID; it authenticates to the gateway with OAuth client credentials.
                properties:
                  endpoint:
                    pattern: ^https://
                    type: string
                  inlineCard:
                    description: Card may be inlined only where the external endpoint
                      cannot serve one.
                    type: string
                  oauthClientRef:
                    type: string
                required:
                - endpoint
                type: object
              gates:
                description: |-
                  Gates must pass before a candidate revision receives traffic (ADR-0006).
                  At least one is required in prod, iff the EvalSuite CRD is installed;
                  otherwise rollouts proceed with a loud GatesSkipped condition.
                items:
                  properties:
                    evalSuiteRef:
                      minLength: 1
                      type: string
                  required:
                  - evalSuiteRef
                  type: object
                type: array
              knowledge:
                description: |-
                  Knowledge binds pinned KnowledgeGraph versions. Scope is injected by the
                  gateway and enforced by the provider (design 01 A1) — the gateway never
                  parses MCP bodies.
                items:
                  description: |-
                    KnowledgeBinding pins one graph version. Binds are refused to versions that
                    are not active or superseded (design 01 A5.2).

                    The graph reference is inline rather than wrapped in a graphRef object: the
                    wrapper named a protocol, not a choice, so it nested without discriminating.
                    Compare ExposeSpec, whose arm does select between protocols and earns it.
                    Graphs resolve in the agent's own namespace, for the reason ToolBinding gives.
                  properties:
                    name:
                      minLength: 1
                      type: string
                    scope:
                      description: |-
                        Scope narrows what this agent may read: injected by the gateway, enforced
                        by the provider (design 01 A1).
                      properties:
                        entityTypes:
                          items:
                            type: string
                          type: array
                      type: object
                    version:
                      description: Version is pinned. "active" is permitted only in
                        the local profile.
                      minLength: 1
                      type: string
                  required:
                  - name
                  - version
                  type: object
                type: array
              llm:
                description: LLM declares model access. Designs 03, 20 and 25 compile
                  against this.
                properties:
                  egressAllowlist:
                    description: EgressAllowlist may be pinned by a compliance profile
                      (ADR-0014).
                    items:
                      type: string
                    type: array
                  fallback:
                    description: Fallback is the ModelDrifted remediation target (design
                      20).
                    properties:
                      model:
                        type: string
                      provider:
                        type: string
                    required:
                    - model
                    - provider
                    type: object
                  providers:
                    items:
                      type: string
                    type: array
                type: object
              loop:
                description: |-
                  Loop bounds re-entry for this agent. Enforcement is stateless in-proxy CEL
                  over a gateway-owned lineage header (design 22).
                properties:
                  allowReentry:
                    description: AllowReentry opts into bounded revisits. Default
                      is any-revisit-denied.
                    type: boolean
                  maxVisits:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              runtime:
                description: Runtime describes an in-cluster agent workload.
                properties:
                  env:
                    description: Env carries non-secret values only; secrets arrive
                      via EnvFrom.
                    items:
                      description: EnvVar represents an environment variable present
                        in a Container.
                      properties:
                        name:
                          description: |-
                            Name of the environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        value:
                          description: |-
                            Variable references $(VAR_NAME) are expanded
                            using the previously defined environment variables in the container and
                            any service environment variables. If a variable cannot be resolved,
                            the reference in the input string will be unchanged. Double $$ are reduced
                            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                            "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                            Escaped references will never be expanded, regardless of whether the variable
                            exists or not.
                            Defaults to "".
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                            Cannot be used if value is not empty.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  description: The key to select.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the ConfigMap or its
                                    key must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              description: |-
                                Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                              properties:
                                apiVersion:
                                  description: Version of the schema the FieldPath
                                    is written in terms of, defaults to "v1".
                                  type: string
                                fieldPath:
                                  description: Path of the field to select in the
                                    specified API version.
                                  type: string
                              required:
                              - fieldPath
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              description: |-
                                FileKeyRef selects a key of the env file.
                                Requires the EnvFiles feature gate to be enabled.
                              properties:
                                key:
                                  description: |-
                                    The key within the env file. An invalid key will prevent the pod from starting.
                                    The keys defined within a source may consist of any printable ASCII characters except '='.
                                    During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                  type: string
                                optional:
                                  default: false
                                  description: |-
                                    Specify whether the file or its key must be defined. If the file or key
                                    does not exist, then the env var is not published.
                                    If optional is set to true and the specified key does not exist,
                                    the environment variable will not be set in the Pod's containers.

                                    If optional is set to false and the specified key does not exist,
                                    an error will be returned during Pod creation.
                                  type: boolean
                                path:
                                  description: |-
                                    The path within the volume from which to select the file.
                                    Must be relative and may not contain the '..' path or start with '..'.
                                  type: string
                                volumeName:
                                  description: The name of the volume mount containing
                                    the env file.
                                  type: string
                              required:
                              - key
                              - path
                              - volumeName
                              type: object
                              x-kubernetes-map-type: atomic
                            resourceFieldRef:
                              description: |-
                                Selects a resource of the container: only resources limits and requests
                                (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                              properties:
                                containerName:
                                  description: 'Container name: required for volumes,
                                    optional for env vars'
                                  type: string
                                divisor:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: Specifies the output format of the
                                    exposed resources, defaults to "1"
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                resource:
                                  description: 'Required: resource to select'
                                  type: string
                              required:
                              - resource
                              type: object
                              x-kubernetes-map-type: atomic
                            secretKeyRef:
                              description: Selects a key of a secret in the pod's
                                namespace
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
                                    must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  envFrom:
                    items:
                      description: EnvFromSource represents the source of a set of
                        ConfigMaps or Secrets
                      properties:
                        configMapRef:
                          description: The ConfigMap to select from
                          properties:
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap must be defined
                              type: boolean
                          type: object
                          x-kubernetes-map-type: atomic
                        prefix:
                          description: |-
                            Optional text to prepend to the name of each environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        secretRef:
                          description: The Secret to select from
                          properties:
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret must be defined
                              type: boolean
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                    type: array
                  image:
                    description: |-
                      Image is digest-pinned: exactly one "@sha256:" followed by 64 lowercase hex
                      characters (A21). A tag can be repointed at other bytes after a revision is
                      gated — retag while `agent:prod` is serving, let a node drain, and
                      Kubernetes pulls the new image while the spec, the revision digest and the
                      gate result all still name the old one. No Agent write is involved, so
                      nothing in the revision machinery can see it.

                      The rule this comment used to make — "must be cosign-signed; admission
                      rejects unsigned images" — was FALSE and shipped verbatim in the generated
                      CRD. Nothing verifies a signature: CEL cannot, and the chart ships no
                      admission policy. That arrives with the Sigstore policy-controller binding
                      design 07 A2 chose. Digest-pinning is what will make it meaningful, because
                      a signature is verified against a digest.

                      Unconditional, with no local-profile relaxation: one schema applies
                      cluster-wide and CEL has no profile in its evaluation context, so an
                      alternative permitting `:dev` would permit a mutable tag in production.
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'spec.runtime.image must be digest-pinned: <repo>@sha256:<64
                        lowercase hex>. A tag can be repointed after the revision
                        is gated, so the running code would no longer be the code
                        that passed. Resolve the tag to a digest (docker buildx imagetools
                        inspect, or the digest your CI already publishes).'
                      rule: self.matches('^[^@]+@sha256:[0-9a-f]{64}$')
                  port:
                    default: 8080
                    description: Port is the A2A server port.
                    format: int32
                    type: integer
                  replicas:
                    default: 1
                    description: |-
                      Replicas >1 requires the card to assert shared task state, else the
                      operator raises TaskStateUnverified (design 02 §3.2). Mutually exclusive
                      with Sandbox.
                    format: int32
                    minimum: 1
                    type: integer
                  resources:
                    description: ResourceRequirements describes the compute resource
                      requirements.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  sandbox:
                    description: |-
                      Sandbox opts into an isolated, stateful singleton with a persistent
                      scratchpad. Where the runtime class is absent the operator falls back to a
                      hardened Deployment and sets SandboxDowngraded — never silently.
                    properties:
                      profile:
                        enum:
                        - gvisor
                        - kata
                        type: string
                    required:
                    - profile
                    type: object
                required:
                - image
                type: object
                x-kubernetes-validations:
                - message: 'spec.runtime.sandbox is a stateful singleton: set replicas
                    to 1, or drop sandbox to scale out'
                  rule: '!(has(self.sandbox) && self.replicas > 1)'
              tools:
                description: |-
                  Tools grants MCP tool servers. This is the only agent-facing connector
                  surface (ADR-0009).
                items:
                  description: |-
                    ToolBinding grants this agent one MCP tool server, resolved in the agent's own
                    namespace. A name may be served by a Connector tool facet or by an MCPServer
                    CR; names are unique across both kinds within a namespace, enforced at
                    admission (design 11 §4), so the binding needs no kind discriminator — which
                    is why the reference is inline rather than wrapped.

                    There is deliberately no namespace field. Design 24 §4.1 derives the `can_call`
                    ReBAC tuple FROM this binding, so a cross-namespace reference would authorize
                    itself: whoever may create an Agent in one namespace could reach a tool in
                    another. Cross-namespace tool use needs consent from the target namespace (the
                    ReferenceGrant shape) — a design change, not a field.
                  properties:
                    name:
                      minLength: 1
                      type: string
                    requiresApproval:
                      description: |-
                        RequiresApproval routes calls through the approval interceptor, which
                        returns a retryable typed pending and issues a single-use voucher the
                        gateway consumes (design 22).
                      type: boolean
                  required:
                  - name
                  type: object
                type: array
            type: object
            x-kubernetes-validations:
            - message: set exactly one of spec.runtime (an agent this cluster runs)
                or spec.external (an agent running elsewhere)
              rule: has(self.runtime) != has(self.external)
          status:
            properties:
              activeRevision:
                description: ActiveRevision serves traffic.
                type: string
              activeRevisionDigest:
                description: |-
                  ActiveRevisionDigest and CandidateRevisionDigest are the FULL SHA-256 of
                  each revision's behaviour projection, and are the only values compared to
                  decide revision identity (A37).

                  The two fields above are 40-bit names. A chosen 40-bit collision against an
                  attacker-controlled projection takes about a second, and comparing names
                  let a malicious spec present itself as a revision that had already passed
                  its gate. The names stay, because a workload needs one and the ACTIVE
                  column needs to be readable; the decision moved to these.
                type: string
              budget:
                properties:
                  tokensRemaining:
                    format: int64
                    type: integer
                  usdRemaining:
                    type: string
                  usdSpentToday:
                    description: |-
                      USDSpentToday backs the Cost/Day printer column. Spend is what an operator
                      scans a namespace for; remaining is what an agent is throttled on.
                    type: string
                  windowResetsAt:
                    format: date-time
                    type: string
                type: object
              candidateRevision:
                description: |-
                  CandidateRevision is held at weight 0 until its gates pass. At most one is
                  ever in flight; a new generation supersedes it.
                type: string
              candidateRevisionDigest:
                type: string
              cards:
                description: Cards carries one entry per live revision — two coexist
                  during a rollout.
                items:
                  properties:
                    digest:
                      description: Digest detects card drift without minting a new
                        revision.
                      type: string
                    fetchedAt:
                      format: date-time
                      type: string
                    name:
                      type: string
                    revision:
                      type: string
                    revisionDigest:
                      description: |-
                        RevisionDigest identifies which revision this card belongs to (A50); the
                        field above only names it.
                      type: string
                    signed:
                      type: boolean
                    version:
                      type: string
                  required:
                  - revision
                  type: object
                type: array
              conditions:
                description: |-
                  Conditions is a map-list keyed by type: the API server then rejects
                  duplicates outright, for every writer rather than only this operator.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              eval:
                description: |-
                  Eval carries the last gate result. It is a printer column because it answers
                  "why is this Held?", which a developer would otherwise reconstruct by
                  reading conditions.
                properties:
                  at:
                    format: date-time
                    type: string
                  revision:
                    description: Revision names what was gated, so a stale score is
                      recognisable as stale.
                    type: string
                  revisionDigest:
                    description: |-
                      RevisionDigest identifies it (A50). The name is 40 bits and a chosen
                      collision against it costs about a second, so a gate controller comparing
                      evalStatus.revision alone can promote a DIFFERENT projection on the verdict
                      this one earned — a decision made before any workload is inspected, so the
                      workload-level collision guard never sees it.
                    type: string
                  score:
                    description: |-
                      Score is the headline number the gate produced, rendered verbatim in the
                      Eval printer column.
                    type: string
                  suite:
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  AgentPhase renders in `kubectl get agents`. Guard states (BudgetHeld, Killed)
                  win over rollout states.
                enum:
                - Pending
                - Held
                - Canary
                - Ready
                - Degraded
                - BudgetHeld
                - Killed
                type: string
              supersededCandidates:
                description: |-
                  SupersededCandidates records abandoned in-flight candidates so the
                  transition is auditable rather than silent. It is capped: the audit trail
                  belongs in events and receipts, which are durable, whereas an unbounded
                  status list grows an object nobody prunes.

                  Entries are `<name>@<digest>` (A50). A bare name is not an audit record of
                  WHICH revision was abandoned — two colliding projections share the name,
                  so the trail would be unable to distinguish the one that was superseded
                  from the one that superseded it.
                items:
                  type: string
                maxItems: 10
                type: array
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'an Agent name must be at most 52 characters: the operator appends
            a 10-character revision suffix to derive workload names, which must fit
            the 63-character Kubernetes label limit'
          rule: size(self.metadata.name) <= 52
    served: true
    storage: true
    subresources:
      status: {}
