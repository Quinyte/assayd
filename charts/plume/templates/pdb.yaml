{{- if and .Values.operator.podDisruptionBudget.enabled (ne .Values.profile "local") }}
{{- include "plume.validate" . -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "plume.operator.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "plume.labels" . | nindent 4 }}
spec:
  # maxUnavailable, never minAvailable: with N replicas a minAvailable of N
  # permits no eviction at all, so a node drain hangs indefinitely and routine
  # maintenance turns into an incident.
  maxUnavailable: {{ .Values.operator.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "plume.operator.selectorLabels" . | nindent 6 }}
{{- end }}
