# Publishing, held to the bar plume sets for the agents it runs.
#
# ADR-0019 requires agent images to be cosign-signed and admission rejects
# unsigned ones; design 07 §4 says the chart ships "as a cosign-signed OCI
# chart, all images pinned by digest, SBOM attached — the same admission story
# agents get". A platform that demands this of its users and not of itself is
# making an argument it does not believe, and that inconsistency is the first
# thing a security review finds.
#
# Signing is KEYLESS (Fulcio/Rekor via GitHub's OIDC token). There is no private
# key to store, rotate, or leak: the signature is bound to this workflow, in this
# repository, at this commit — a stronger claim than "someone with the key
# signed it", and one a verifier can check without trusting us to have kept a
# secret.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "version to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Lowercased at use, not here: OCI repository names must be lowercase and this
  # organization is "Quinyte". github.repository_owner preserves its case, so
  # interpolating it directly produces an invalid tag — which is exactly how
  # v0.1.1 first failed. The certificate identity below is a GitHub URL and
  # deliberately keeps the original case.
  IMAGE_NAME: quinyte/plume-operator
  CHART_NAME: quinyte/charts/plume
  CHART_REPO: quinyte/charts

jobs:
  image:
    name: build, push, sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to GHCR
      id-token: write      # OIDC, for keyless signing and provenance
      attestations: write  # SLSA provenance
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: version
        run: |
          set -euo pipefail
          v="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/arm64 is not an afterthought: plume targets laptop clusters, and
      # a chunk of those are Apple Silicon.
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          # Reproducibility: the same source produces the same image.
          provenance: false
          sbom: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the DIGEST, never the tag. A tag can be moved to point at something
      # else after signing; a digest is the content.
      - name: cosign sign
        run: |
          set -euo pipefail
          cosign sign --yes \
            "${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"

      - name: generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      # Attached as a signed attestation rather than a build artifact: an SBOM
      # nobody can verify is documentation, not supply-chain evidence.
      - name: attach SBOM attestation
        run: |
          set -euo pipefail
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson \
            "${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"

      # SLSA provenance via GitHub's attestation API is not available for
      # user-owned PRIVATE repositories — the API returns "Feature not available
      # for user-owned private repositories". The first v0.1.0 run failed here,
      # after successfully pushing, signing and attesting the SBOM.
      #
      # Conditional rather than continue-on-error: a step that always "succeeds"
      # teaches nobody anything, and this one starts working by itself the day
      # the repository goes public or moves to an organization. The gap is
      # recorded in docs/supply-chain.md, because a supply-chain page that
      # implies provenance exists when it does not is worse than one that admits
      # the hole.
      - name: SLSA provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: note that provenance was skipped
        if: github.event.repository.visibility != 'public'
        run: |
          echo "::warning::SLSA provenance skipped: GitHub's attestation API does not " \
            "support user-owned private repositories. The image is still cosign-signed " \
            "and carries an SBOM attestation. See docs/supply-chain.md."

      # Verify what we just published, from the outside, exactly as a consumer
      # would. `if: always()` because this is the step that proves the signature
      # is real — gating it behind an optional step meant the first release
      # pushed a signed image and never checked it, which is how an unverified
      # artifact ships while the log looks reassuring.
      - name: verify the published image
        if: always() && steps.push.outcome == 'success'
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"
          cosign verify-attestation --type spdxjson \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"

  chart:
    name: package, push, sign the chart
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The chart ships pinned to the DIGEST of the image this run built, not to
      # a tag that could later point elsewhere. This is the same rule plume
      # enforces on agent images, applied to plume.
      - name: pin the chart to the published digest
        run: |
          set -euo pipefail
          # yq ships in the ubuntu-latest image. The pinned installer that used
          # to live here fetched yq_linux_arm64 — correct only for the DGX, and
          # an unrunnable binary anywhere else.
          v="${{ needs.image.outputs.version }}"
          d="${{ needs.image.outputs.digest }}"
          yq -i ".version = \"${v}\" | .appVersion = \"${v}\"" charts/plume/Chart.yaml
          yq -i ".operator.image.tag = \"${v}\" | .operator.image.digest = \"${d}\"" charts/plume/values.yaml
          grep -E "digest|tag" charts/plume/values.yaml | head -4

      - name: package and push
        run: |
          set -euo pipefail
          # helm ships in the ubuntu-latest image. An arm64 fallback lived here
          # from the brief self-hosted detour and would have installed the wrong
          # architecture had it ever fired.
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${REGISTRY}" \
            --username "${{ github.actor }}" --password-stdin
          helm package charts/plume --destination /tmp
          # 2>&1 matters: helm writes "Pushed:" and "Digest:" to STDERR, so a
          # plain pipe to tee captures an empty file and the digest extraction
          # below finds nothing — after the chart has already been pushed.
          helm push "/tmp/plume-${{ needs.image.outputs.version }}.tgz" \
            "oci://${REGISTRY}/${CHART_REPO}" 2>&1 | tee /tmp/push.log
          # grep -m1, not `grep | head -1`: head closes the pipe, grep takes
          # SIGPIPE, and pipefail turns a successful push into a failed step.
          # That exact race already cost a CI run; it was fixed in ci.yml and
          # missed here, which is the same one-file-at-a-time mistake twice.
          grep -m1 -oE "sha256:[0-9a-f]{64}" /tmp/push.log > /tmp/chart.digest
          test -s /tmp/chart.digest || { echo "no chart digest in push output"; exit 1; }

      - name: sign the chart
        run: |
          set -euo pipefail
          cosign sign --yes \
            "${REGISTRY}/${CHART_NAME}@$(cat /tmp/chart.digest)"

      - name: verify the published chart
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REGISTRY}/${CHART_NAME}@$(cat /tmp/chart.digest)"
