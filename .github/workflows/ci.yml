# The gate the corpus keeps claiming. Until this existed, "enforced by a test
# rather than by review discipline" meant "enforced by remembering to type make".
#
# Actions are pinned by commit SHA and tools by version, not by moving tag.
# assayd's own admission story requires agent images to be cosign-signed and
# digest-pinned; a CI that pipes an unpinned script from a moving branch into
# bash would be the platform failing its own bar in the most visible place.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  K3D_VERSION: v5.9.0
  KUBECONFORM_VERSION: v0.8.0
  RUNNER_ARCH_SUFFIX: amd64

jobs:
  verify:
    name: build, vet, unit, envtest, chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # helm and kubectl ship in the ubuntu-latest image. The hand-rolled
      # installer that used to live here existed only while CI ran on a bare
      # self-hosted box, and it carried a race: `grep -o ... | head -1` lets
      # head close the pipe first, grep takes SIGPIPE, and pipefail turns that
      # into a step failure. It passed in two jobs and failed in a third on the
      # same commit, which is the signature of exactly that.

      # `make verify` installs crdoc with `go install pkg@version`. That module
      # graph is outside this one, so setup-go's cache neither keys on it nor
      # re-saves it on a hit, and the ~176 MB download ran on EVERY job. Cache
      # the binary, keyed on the version the Makefile pins, and it is fetched
      # once per version instead.
      #
      # Not Go's `tool` directive, which would also fix it: that merges crdoc's
      # dependency graph into this module, and crdoc pins OLDER sigs.k8s.io/yaml,
      # go-logr and structured-merge-diff than the operator builds against.
      # Trading a correctness hazard in the operator for a cache is a bad trade;
      # the measurement is in the Makefile.
      - name: pinned crdoc version
        id: crdoc
        run: |
          set -euo pipefail
          echo "version=$(make -s print-crdoc-version)" >> "$GITHUB_OUTPUT"
          echo "bin=$(go env GOPATH)/bin/crdoc" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.crdoc.outputs.bin }}
          key: crdoc-${{ runner.os }}-${{ steps.crdoc.outputs.version }}

      # Covers the generated CRD and RBAC, and since the reference landed, the
      # three pages under docs/reference/ as well: `make verify` regenerates all
      # of them and fails if what is committed differs. A generator nobody runs
      # is worse than none — its output reads as current and is not — so this is
      # where docs/reference/ stops being a document and starts being a gate.
      - name: generation is reproducible and committed (CRD, RBAC, docs/reference)
        run: make verify

      - name: vet
        run: make vet

      - name: unit
        run: make unit

      # The dependency contract read from the pinned agentgateway chart, and
      # the untagged half of the cluster suite — test/conformance/ancestor.go's
      # transcription of policyReport, which exists because that transcription
      # already drifted once and which ran in no automated gate until now
      # (design 03 A82). It needs no cluster and no network.
      - name: dependency contract and the policy-report transcription
        run: make conformance

      # A superseded guarantee must not survive in the text implementers build
      # from. Also in `make test` and, like conformance, in no CI job before.
      - name: docs do not carry a superseded guarantee
        run: make docs

      - name: unit (race)
        run: make race

      - name: envtest against a real API server
        run: make envtest

      - name: chart doctrine (pod budget, stateful allowlist, RBAC drift)
        run: make chart

      - name: install kubeconform
        run: |
          set -euo pipefail
          # /usr/local/bin is already on PATH here. Writing to ~/.local/bin was a
          # leftover from the self-hosted runner, where sudo needed a password —
          # and it depended on a mkdir in a step that no longer exists.
          curl -sSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-${RUNNER_ARCH_SUFFIX}.tar.gz"
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: rendered manifests validate against supported k8s versions
        run: make chart-conform

  # NFR-3 says assayd runs anywhere. Design 07 §5 makes that enforced rather than
  # aspirational by running the same scenario on more than one distro: a bug that
  # only appears on k3s's storage class or kind's networking is exactly what a
  # single-distro pipeline misses.
  e2e:
    name: e2e (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The cluster is NAMED here rather than left to hack/e2e.sh. Unnamed, the
      # script invents a cluster per run and deletes it on exit — the isolation
      # that lets several runs share a developer's machine. A CI job owns a
      # whole VM, so there is nothing to isolate from, and a name the script
      # does not own is a cluster it does not delete: which is what leaves the
      # failure step below something to read logs from.
      matrix:
        include:
          - distro: k3d
            cluster: assayd-ci
          - distro: kind
            cluster: assayd-local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # helm and kubectl ship in the ubuntu-latest image. The hand-rolled
      # installer that used to live here existed only while CI ran on a bare
      # self-hosted box, and it carried a race: `grep -o ... | head -1` lets
      # head close the pipe first, grep takes SIGPIPE, and pipefail turns that
      # into a step failure. It passed in two jobs and failed in a third on the
      # same commit, which is the signature of exactly that.

      - name: install k3d
        if: matrix.distro == 'k3d'
        run: |
          set -euo pipefail
          curl -sSLo /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-${RUNNER_ARCH_SUFFIX}"
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
          k3d version

      - name: create kind cluster
        if: matrix.distro == 'kind'
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: ${{ matrix.cluster }}

      # A skipped e2e is an untested feature: hack/e2e.sh exits non-zero rather
      # than skipping, and the suite itself registers a failing sentinel when
      # ASSAYD_E2E is unset.
      - name: e2e
        run: make e2e
        env:
          DISTRO: ${{ matrix.distro }}
          CLUSTER: ${{ matrix.cluster }}

      - name: operator logs on failure
        if: failure()
        run: |
          # hack/e2e.sh keeps its kubeconfig to itself and never writes the
          # default one — that is exactly what stops two runs measuring each
          # other's deployment — so this step builds its own from the named
          # cluster instead of reading a default that is now deliberately left
          # alone. kind-action still writes the default on the kind lane.
          if [ "${{ matrix.distro }}" = "k3d" ]; then
            KUBECONFIG="$(mktemp)"
            export KUBECONFIG
            k3d kubeconfig get "${{ matrix.cluster }}" > "$KUBECONFIG" || true
          fi
          kubectl -n assayd-system describe deploy/assayd-agent-operator || true
          kubectl -n assayd-system logs -l app.kubernetes.io/component=agent-operator --tail=200 || true
          kubectl get agents -A -o yaml || true
