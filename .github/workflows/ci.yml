# The gate the corpus keeps claiming. Until this existed, "enforced by a test
# rather than by review discipline" meant "enforced by remembering to type make".
#
# Actions are pinned by commit SHA and tools by version, not by moving tag.
# plume's own admission story requires agent images to be cosign-signed and
# digest-pinned; a CI that pipes an unpinned script from a moving branch into
# bash would be the platform failing its own bar in the most visible place.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  K3D_VERSION: v5.9.0
  KUBECONFORM_VERSION: v0.8.0
  HELM_VERSION: v3.19.0
  KUBECTL_VERSION: v1.36.2
  RUNNER_ARCH_SUFFIX: amd64

jobs:
  verify:
    name: build, vet, unit, envtest, chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: install pinned tools
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.local/bin:${PATH}"

          if [ "$(helm version --short 2>/dev/null | cut -d+ -f1)" != "${HELM_VERSION}" ]; then
            curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-${RUNNER_ARCH_SUFFIX}.tar.gz" \
              | tar -xz -C /tmp
            install -m 0755 "/tmp/linux-${RUNNER_ARCH_SUFFIX}/helm" "${HOME}/.local/bin/helm"
          fi

          if [ "$(kubectl version --client -o json 2>/dev/null | grep -o "\"gitVersion\":\"[^\"]*" | head -1 | cut -d'"' -f4)" != "${KUBECTL_VERSION}" ]; then
            curl -sSLo "${HOME}/.local/bin/kubectl" \
              "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${RUNNER_ARCH_SUFFIX}/kubectl"
            chmod 0755 "${HOME}/.local/bin/kubectl"
          fi

          helm version --short
          kubectl version --client 2>/dev/null | head -1

      - name: generation is reproducible and committed
        run: make verify

      - name: vet
        run: make vet

      - name: unit
        run: make unit

      - name: unit (race)
        run: make race

      - name: envtest against a real API server
        run: make envtest

      - name: chart doctrine (pod budget, stateful allowlist, RBAC drift)
        run: make chart

      - name: install kubeconform
        run: |
          set -euo pipefail
          curl -sSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-${RUNNER_ARCH_SUFFIX}.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C "${HOME}/.local/bin" kubeconform

      - name: rendered manifests validate against supported k8s versions
        run: make chart-conform

  # NFR-3 says plume runs anywhere. Design 07 §5 makes that enforced rather than
  # aspirational by running the same scenario on more than one distro: a bug that
  # only appears on k3s's storage class or kind's networking is exactly what a
  # single-distro pipeline misses.
  e2e:
    name: e2e (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [k3d, kind]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: install pinned tools
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.local/bin:${PATH}"

          if [ "$(helm version --short 2>/dev/null | cut -d+ -f1)" != "${HELM_VERSION}" ]; then
            curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-${RUNNER_ARCH_SUFFIX}.tar.gz" \
              | tar -xz -C /tmp
            install -m 0755 "/tmp/linux-${RUNNER_ARCH_SUFFIX}/helm" "${HOME}/.local/bin/helm"
          fi

          if [ "$(kubectl version --client -o json 2>/dev/null | grep -o "\"gitVersion\":\"[^\"]*" | head -1 | cut -d'"' -f4)" != "${KUBECTL_VERSION}" ]; then
            curl -sSLo "${HOME}/.local/bin/kubectl" \
              "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${RUNNER_ARCH_SUFFIX}/kubectl"
            chmod 0755 "${HOME}/.local/bin/kubectl"
          fi

          helm version --short
          kubectl version --client 2>/dev/null | head -1

      - name: install k3d
        if: matrix.distro == 'k3d'
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          curl -sSLo /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-${RUNNER_ARCH_SUFFIX}"
          install -m 0755 /tmp/k3d "${HOME}/.local/bin/k3d"
          k3d version

      - name: create kind cluster
        if: matrix.distro == 'kind'
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: plume-local

      # A skipped e2e is an untested feature: hack/e2e.sh exits non-zero rather
      # than skipping, and the suite itself registers a failing sentinel when
      # PLUME_E2E is unset.
      - name: e2e
        run: make e2e
        env:
          DISTRO: ${{ matrix.distro }}

      - name: operator logs on failure
        if: failure()
        run: |
          kubectl -n plume-system describe deploy/plume-agent-operator || true
          kubectl -n plume-system logs -l app.kubernetes.io/component=agent-operator --tail=200 || true
          kubectl get agents -A -o yaml || true
